version: '3.8'

services:

  backend:
    build: ./backend
    ports:
      - 8080:8080
    volumes:
      - ./backend:/app
    command: /bin/sh -c ". /app/venv/bin/activate && uvicorn src.main:app --host 0.0.0.0 --port 8080"

  frontend:
    build: ./frontend
    volumes:
      - './frontend:/app'
      - '/app/node_modules'
    ports:
      - 5173:5173

  db:
    image: postgres
    container_name: snaptastic-db
    environment:
        POSTGRES_PASSWORD: root
        POSTGRES_DB: snaptastic
    volumes:
      - db-data:/var/lib/postgresql/data 
    ports:
      - 5432:5432

volumes:
  db-data: